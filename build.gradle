import net.neoforged.nfrtgradle.CreateMinecraftArtifacts
import net.neoforged.nfrtgradle.NeoFormRuntimeTask

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

if (JavaVersion.current() != JavaVersion.VERSION_25) {
    throw new GradleException('Chronicle requires JDK 25 for Gradle. Set JAVA_HOME and the IDE Gradle JVM to JDK 25.')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// ModDevGradle otherwise selects separate Java versions for NeoForm and its tools.
def java25Executable = javaToolchains.launcherFor(java.toolchain).map {
    launcher -> launcher.executablePath.asFile.absolutePath
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('chronicle.runDirectory').getOrElse('run/server'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Apply after neoForge registers its tasks, overriding its Minecraft-version defaults.
tasks.withType(NeoFormRuntimeTask).configureEach {
    javaExecutable = java25Executable
}
tasks.withType(CreateMinecraftArtifacts).configureEach {
    toolsJavaExecutable = java25Executable
}

// Attach console input at execution time so configuration-cache entries stay reusable.
tasks.named('runServer', JavaExec).configure {
    doFirst { task -> task.standardInput = System.in }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    jffiNative {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    jarJar(implementation('net.openhft:chronicle-queue:2026.7') {
        // Minecraft 1.21.1 strictly pins SLF4J to 2.0.9.
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'net.openhft', module: 'chronicle-analytics'
    }) { version { strictly '[2026.7]'; prefer '2026.7' } }
    jarJar(implementation('org.xerial:sqlite-jdbc:3.53.4.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }) { version { strictly '[3.53.4.0]'; prefer '3.53.4.0' } }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Pure tests do not launch Minecraft, which supplies SLF4J in the server.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // JarJar embeds direct declarations only. Minecraft supplies ASM, JNA and SLF4J.
    [
        'net.openhft:chronicle-core:2026.6', 'net.openhft:chronicle-bytes:2026.4',
        'net.openhft:chronicle-wire:2026.10', 'net.openhft:chronicle-threads:2026.4',
        'net.openhft:compiler:2026.2', 'net.openhft:posix:2026.2', 'net.openhft:affinity:2026.2',
        'com.github.jnr:jnr-ffi:2.2.15', 'com.github.jnr:jffi:1.3.12',
        'com.github.jnr:jnr-a64asm:1.0.0',
        'com.github.jnr:jnr-x86asm:1.0.2', 'com.github.jnr:jnr-constants:0.10.4',
        'commons-cli:commons-cli:1.5.0'
    ].each { coordinate ->
        def pinned = coordinate.split(':')[2]
        jarJar(coordinate) { version { strictly "[${pinned}]"; prefer pinned } }
    }
    // Classifier Maven identities collide in JarJar. Local-file packaging uses the
    // native JAR's existing distinct Automatic-Module-Name, preserving its bytes/notices.
    jffiNative 'com.github.jnr:jffi:1.3.12:native'
    jarJar files(configurations.jffiNative)
}

def chronicleJvmArgs = file('chronicle-jvm.args').readLines()
        .findAll { !it.isBlank() && !it.startsWith('#') }
neoForge.runs.configureEach {
    chronicleJvmArgs.each { jvmArgument it }
}
neoForge.runs.server.additionalRuntimeClasspathConfiguration.extendsFrom(configurations.implementation)
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs chronicleJvmArgs
    maxHeapSize = '512m'
    testLogging { events 'failed', 'skipped'; showStandardStreams = true }
    systemProperty 'chronicle.testClasspath', sourceSets.test.runtimeClasspath.asPath
}
tasks.named('test', Test).configure { useJUnitPlatform { excludeTags 'stress' } }
tasks.register('stressTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'stress' }
    outputs.upToDateWhen { false }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    spike {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gameTest)
neoForge.mods {
    chronicle_test { sourceSet(sourceSets.gameTest) }
}
neoForge.runs.configureEach {
    loadedMods = [neoForge.mods.chronicle]
}
neoForge.runs.gameTestServer {
    sourceSet = sourceSets.gameTest
    loadedMods = [neoForge.mods.chronicle, neoForge.mods.chronicle_test]
    additionalRuntimeClasspathConfiguration.extendsFrom(configurations.implementation)
    systemProperty 'chronicle.gameTestRoot', file('.agent/scratch/game-tests').absolutePath
}

tasks.register('journalSpike', JavaExec) {
    classpath = sourceSets.spike.runtimeClasspath
    mainClass = 'io.github.andriyko69.chronicle.spike.JournalSpike'
    args 'suite'
    systemProperty 'chronicle.analytics.disable', 'true'
    jvmArgs chronicleJvmArgs
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
    from('licenses/third-party') { into 'META-INF/licenses/third-party' }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
