import net.neoforged.nfrtgradle.CreateMinecraftArtifacts
import net.neoforged.nfrtgradle.NeoFormRuntimeTask

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

if (JavaVersion.current() != JavaVersion.VERSION_25) {
    throw new GradleException('Chronicle requires JDK 25 for Gradle. Set JAVA_HOME and the IDE Gradle JVM to JDK 25.')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Chronicle deliberately requires Java 25, including its dedicated server runtime.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// ModDevGradle otherwise selects separate Java versions for NeoForm and its tools.
def java25Executable = javaToolchains.launcherFor(java.toolchain).map {
    launcher -> launcher.executablePath.asFile.absolutePath
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('chronicle.runDirectory').getOrElse('run/server'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dormant until real tests exist: an empty GameTest suite fails at startup.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Apply after neoForge registers its tasks, overriding its Minecraft-version defaults.
tasks.withType(NeoFormRuntimeTask).configureEach {
    javaExecutable = java25Executable
}
tasks.withType(CreateMinecraftArtifacts).configureEach {
    toolsJavaExecutable = java25Executable
}

// Attach console input at execution time so configuration-cache entries stay reusable.
tasks.named('runServer', JavaExec).configure {
    doFirst { task -> task.standardInput = System.in }
}

// Optional development mods belong in localRuntime rather than published dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
